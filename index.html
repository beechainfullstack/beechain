<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bee · Under Construction — beechain.xyz</title>
  <meta name="description" content="A new digital presence is being crafted. Returning soon." />
  <meta name="theme-color" content="#050608" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600&family=Nunito:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --void-900: #050608;
      --void-800: #0a0c10;
      --gold-leaf: #d4af37;
      --gold-dim: #8a7020;
      --jade-mist: #5d9c59;
      --ink-primary: #e5e7eb;
      --ink-secondary: #9ca3af;
      --ink-muted: #6b7280;
      --font-display: 'Noto Serif', serif;
      --font-body: 'Nunito', sans-serif;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      background: radial-gradient(circle at 50% 0%, #1a1f28 0%, var(--void-900) 60%),
                  radial-gradient(circle at 80% 20%, rgba(93, 156, 89, 0.08) 0%, transparent 40%),
                  radial-gradient(circle at 20% 80%, rgba(212, 175, 55, 0.06) 0%, transparent 40%);
      background-color: var(--void-900);
      color: var(--ink-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      position: relative;
    }
    .mist {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      pointer-events: none;
      animation: drift 20s ease-in-out infinite;
    }
    .mist-1 {
      top: -10%; right: -10%;
      width: 50vw; height: 50vw;
      background: radial-gradient(circle, var(--jade-mist) 0%, transparent 70%);
    }
    .mist-2 {
      bottom: -10%; left: -10%;
      width: 60vw; height: 60vw;
      background: radial-gradient(circle, var(--gold-leaf) 0%, transparent 70%);
      animation-delay: -5s;
      animation-direction: reverse;
    }
    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(2%, 3%) scale(1.05); }
      66% { transform: translate(-1%, 2%) scale(0.95); }
    }
    .container {
      position: relative;
      z-index: 1;
      max-width: 680px;
      padding: 2rem;
    }
    .ring-container {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 0 auto 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid transparent;
      border-top-color: var(--gold-leaf);
      border-right-color: var(--gold-dim);
      opacity: 0.6;
      animation: spin linear infinite;
    }
    .ring-outer {
      width: 100%; height: 100%;
      border-width: 1px;
      animation-duration: 30s;
    }
    .ring-inner {
      width: 70%; height: 70%;
      border-width: 2px;
      border-top-color: var(--jade-mist);
      border-right-color: var(--jade-mist);
      animation-duration: 20s;
      animation-direction: reverse;
      opacity: 0.8;
    }
    .ring-center {
      width: 40%; height: 40%;
      border-width: 1px;
      border-color: rgba(212, 175, 55, 0.3);
      animation-duration: 15s;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .headshot-frame {
      position: absolute;
      width: 120px; height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #2a2f38, #0a0c10);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(212, 175, 55, 0.2);
    }
    .headshot-frame img {
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0.7;
      filter: grayscale(0.3) sepia(0.2);
    }
    h1 {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 6vw, 3.5rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--ink-primary);
      margin-bottom: 1.5rem;
      line-height: 1.1;
    }
    .subtitle {
      font-size: clamp(1.1rem, 2.5vw, 1.25rem);
      color: var(--ink-secondary);
      font-weight: 400;
      line-height: 1.7;
      max-width: 28rem;
      margin: 0 auto 2.5rem;
    }
    .divider {
      width: 60px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-leaf), transparent);
      margin: 0 auto 2.5rem;
      opacity: 0.6;
    }
    .message {
      font-size: 1rem;
      color: var(--ink-muted);
      font-style: italic;
      margin-bottom: 3rem;
    }
    .contact-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--gold-leaf);
      text-decoration: none;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 999px;
      transition: all 0.3s var(--ease-out);
      background: rgba(212, 175, 55, 0.05);
    }
    .contact-link:hover {
      background: rgba(212, 175, 55, 0.1);
      border-color: var(--gold-leaf);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px -10px rgba(212, 175, 55, 0.3);
    }
    footer {
      position: absolute;
      bottom: 2rem;
      font-size: 0.85rem;
      color: var(--ink-muted);
      font-weight: 600;
    }
    footer a {
      color: var(--ink-secondary);
      text-decoration: none;
    }
    footer a:hover {
      color: var(--gold-leaf);
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
    @media (max-width: 640px) {
      .container { padding: 1.5rem; }
      .ring-container { width: 150px; height: 150px; margin-bottom: 2rem; }
      .headshot-frame { width: 100px; height: 100px; }
    }
  </style>
</head>
<body>
  <div class="mist mist-1" aria-hidden="true"></div>
  <div class="mist mist-2" aria-hidden="true"></div>
  <div class="container">
    <div class="ring-container">
      <div class="ring ring-outer"></div>
      <div class="ring ring-inner"></div>
      <div class="ring ring-center"></div>
      <div class="headshot-frame">
        <img src="imgs/seoul pfp v2.png" alt="Bee" onerror="this.style.display='none'" />
      </div>
    </div>
    <h1>Under Construction</h1>
    <div class="divider"></div>
    <p class="subtitle">
      A new digital presence is being crafted.<br />
      Returning soon with clarity, purpose, and grace.
    </p>
    <p class="message">"In the void, all things are possible."</p>
    <a href="mailto:bebrower@gmail.com" class="contact-link">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
        <polyline points="22,6 12,13 2,6"></polyline>
      </svg>
      Get in touch
    </a>
  </div>
  <footer>
    <p>&copy; <span id="year">2026</span> Bee · <a href="https://beechain.xyz">beechain.xyz</a></p>
  </footer>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
